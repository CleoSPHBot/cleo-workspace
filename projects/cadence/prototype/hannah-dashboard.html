<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hannah — Cadence Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f4f8;
      color: #1a1a2e;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, #1a5f8a 0%, #0d3f5f 100%);
      color: white;
      padding: 20px 24px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-left h1 { font-size: 1.4rem; font-weight: 700; }
    .header-left .subtitle { font-size: 0.8rem; opacity: 0.75; margin-top: 2px; }
    .simple-toggle {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      color: white;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .simple-toggle:active { background: rgba(255,255,255,0.25); }

    /* ── Simple mode ── */
    body.simple-mode .nav-tabs { display: none; }
    body.simple-mode .section-label { display: none; }
    body.simple-mode .day-row { display: none; }
    body.simple-mode .pills-row { display: none; }
    body.simple-mode .sleep-bar-wrap { display: none; }
    body.simple-mode .notes-text { display: none; }
    body.simple-mode .footer { display: none; }
    body.simple-mode .metrics-row { display: none; }
    body.simple-mode #simple-card { display: block !important; }
    body.simple-mode .today-card { display: none; }
    body.simple-mode #pattern-alerts { display: none; }
    body.simple-mode #days-container { display: none; }

    /* ── Simple card ── */
    #simple-card {
      display: none;
      margin-top: 20px;
    }
    .simple-status {
      border-radius: 24px;
      padding: 32px 24px;
      text-align: center;
      margin-bottom: 16px;
    }
    .simple-status.status-red    { background: linear-gradient(135deg, #c0392b, #922b21); color: white; }
    .simple-status.status-yellow { background: linear-gradient(135deg, #d4a017, #a07810); color: white; }
    .simple-status.status-green  { background: linear-gradient(135deg, #1a8a4a, #0d5c30); color: white; }
    .simple-emoji { font-size: 4rem; margin-bottom: 12px; }
    .simple-headline { font-size: 1.6rem; font-weight: 800; margin-bottom: 8px; line-height: 1.2; }
    .simple-sub { font-size: 1rem; opacity: 0.85; }
    .simple-metrics {
      display: flex; gap: 12px; justify-content: center;
      margin-bottom: 16px;
    }
    .simple-metric {
      background: white;
      border-radius: 16px;
      padding: 16px 20px;
      text-align: center;
      flex: 1;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .simple-metric .big-val {
      font-size: 2rem; font-weight: 900; line-height: 1;
    }
    .simple-metric .big-lbl {
      font-size: 0.8rem; color: #6b7a8d; margin-top: 6px;
      font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
    }
    .simple-note {
      background: white;
      border-radius: 16px;
      padding: 16px 20px;
      font-size: 1rem;
      color: #4a5568;
      font-style: italic;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      text-align: center;
      line-height: 1.5;
    }

    .avatar {
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(255,255,255,0.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem;
    }

    /* ── Nav tabs ── */
    .nav-tabs {
      background: #fff;
      display: flex;
      border-bottom: 1px solid #e0e7ef;
      overflow-x: auto;
    }
    .nav-tab {
      padding: 12px 20px;
      font-size: 0.82rem;
      font-weight: 600;
      color: #6b7a8d;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      cursor: pointer;
    }
    .nav-tab.active { color: #1a5f8a; border-bottom-color: #1a5f8a; }

    /* ── Content ── */
    main { padding: 16px; max-width: 480px; margin: 0 auto; }

    /* ── Section label ── */
    .section-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #6b7a8d;
      margin: 20px 0 8px;
    }

    /* ── Day row ── */
    .day-row {
      background: white;
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
    }
    .day-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .day-label { font-size: 0.95rem; font-weight: 700; }
    .day-label .day-sub { font-size: 0.75rem; font-weight: 400; color: #8a9ab0; }
    .feeling-badge {
      font-size: 0.75rem; font-weight: 700;
      padding: 3px 10px; border-radius: 20px;
    }
    .feeling-good    { background: #d4edda; color: #155724; }
    .feeling-mixed   { background: #fff3cd; color: #856404; }
    .feeling-bad     { background: #f8d7da; color: #721c24; }
    .feeling-unknown { background: #e9ecef; color: #6c757d; }

    /* ── WHOOP metrics row ── */
    .metrics-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    .metric-chip {
      flex: 1;
      background: #f0f4f8;
      border-radius: 10px;
      padding: 8px 6px;
      text-align: center;
    }
    .metric-chip .val {
      font-size: 1.1rem; font-weight: 800;
      line-height: 1;
    }
    .metric-chip .lbl {
      font-size: 0.62rem; color: #6b7a8d; margin-top: 3px;
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .val-green  { color: #1a8a4a; }
    .val-yellow { color: #b08a00; }
    .val-red    { color: #c0392b; }
    .val-blue   { color: #1a5f8a; }
    .val-gray   { color: #8a9ab0; }

    /* ── Symptom pills ── */
    .pills-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .pill {
      font-size: 0.72rem; font-weight: 600;
      padding: 3px 10px; border-radius: 20px;
      border: 1px solid transparent;
    }
    .pill-none    { background: #d4edda; color: #155724; border-color: #b8dfc5; }
    .pill-mild    { background: #fff3cd; color: #856404; border-color: #fde1a0; }
    .pill-moderate{ background: #ffe4cc; color: #7a3f00; border-color: #f5c99a; }
    .pill-severe  { background: #f8d7da; color: #721c24; border-color: #f0a9ae; }
    .pill-neutral { background: #e9ecef; color: #495057; border-color: #dee2e6; }

    /* ── Notes ── */
    .notes-text {
      font-size: 0.78rem; color: #4a5568;
      font-style: italic;
      background: #f8fafc;
      border-left: 3px solid #1a5f8a;
      padding: 6px 10px;
      border-radius: 0 6px 6px 0;
      margin-top: 8px;
    }

    /* ── Sleep bar ── */
    .sleep-bar-wrap { margin: 6px 0 4px; }
    .sleep-bar-label { font-size: 0.68rem; color: #6b7a8d; margin-bottom: 3px; }
    .sleep-bar-track {
      height: 6px; background: #e0e7ef; border-radius: 3px; overflow: hidden;
    }
    .sleep-bar-fill {
      height: 100%; border-radius: 3px;
      background: linear-gradient(90deg, #1a5f8a, #2a9d8f);
    }
    .sleep-bar-fill.fill-red {
      background: linear-gradient(90deg, #c0392b, #e74c3c);
    }

    /* ── Today card ── */
    .today-card {
      background: linear-gradient(135deg, #1a5f8a 0%, #0d3f5f 100%);
      color: white;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 8px;
    }
    .today-card .day-label { color: white; }
    .today-card .day-sub { color: rgba(255,255,255,0.7); }
    .today-card .metric-chip { background: rgba(255,255,255,0.15); }
    .today-card .val-green  { color: #6fd9a0; }
    .today-card .val-yellow { color: #ffd166; }
    .today-card .val-red    { color: #ef8a7a; }
    .today-card .val-blue   { color: #90cef0; }
    .today-card .val-gray   { color: rgba(255,255,255,0.5); }
    .today-card .metric-chip .lbl { color: rgba(255,255,255,0.65); }
    .today-card .no-data-label {
      font-size: 0.8rem; opacity: 0.7; margin-top: 8px; text-align: center;
    }

    /* ── Alerts ── */
    .alert-strip {
      background: #fff3cd;
      border: 1px solid #fde1a0;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.8rem;
      color: #856404;
      margin-bottom: 12px;
      display: flex; gap: 8px; align-items: flex-start;
    }
    .alert-icon { font-size: 1rem; flex-shrink: 0; margin-top: 1px; }

    /* ── SpO2 alert ── */
    .spo2-alert {
      background: #f8d7da;
      border-color: #f0a9ae;
      color: #721c24;
    }

    /* ── Critical alert ── */
    .critical-alert {
      background: #f8d7da;
      border: 2px solid #c0392b;
      color: #721c24;
    }

    /* ── Footer ── */
    .footer {
      text-align: center;
      font-size: 0.7rem;
      color: #9aabbf;
      padding: 20px 0 32px;
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>Hannah M.</h1>
    <div class="subtitle">Cadence · Long COVID tracker</div>
  </div>
  <button class="simple-toggle" id="simple-btn" onclick="toggleSimple()">🧘 Simple</button>
</header>

<div class="nav-tabs">
  <div class="nav-tab active">Dashboard</div>
  <div class="nav-tab">Timeline</div>
  <div class="nav-tab">Patterns</div>
  <div class="nav-tab">Reports</div>
</div>

<main>

  <!-- ── Dynamic Pattern Alerts ── -->
  <div id="pattern-alerts" style="margin-top:14px;"></div>

  <!-- ── Simple mode card ── -->
  <div id="simple-card">
    <div id="simple-status-block"></div>
  </div>

  <!-- ── Dynamic daily cards ── -->
  <div id="days-container"></div>

  <div class="footer" id="footer">Cadence · Loading…</div>

</main>
<script>
const WHOOP_USER_ID = 6729032;

// Eastern-time date strings
function easternDate(offsetDays = 0) {
  const d = new Date(new Date().toLocaleString('en-US', { timeZone: 'America/New_York' }));
  d.setDate(d.getDate() - offsetDays);
  return d.toISOString().slice(0, 10);
}

function fmtDate(iso) {
  const [y, m, d] = iso.split('-');
  const dt = new Date(+y, +m - 1, +d);
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${days[dt.getDay()]} · ${months[+m-1]} ${+d}`;
}

function feelingBadge(feeling, checkin) {
  if (!checkin) return `<div class="feeling-badge feeling-unknown" style="background:rgba(255,255,255,0.15);color:rgba(255,255,255,0.6);">No check-in</div>`;
  const map = { good: ['feeling-good', '😊 Good'], okay: ['feeling-mixed', '😐 Okay'],
                bad: ['feeling-bad', '😔 Bad'], terrible: ['feeling-bad', '😭 Terrible'] };
  const [cls, label] = map[feeling] || ['feeling-unknown', feeling || '—'];
  return `<div class="feeling-badge ${cls}">${label}</div>`;
}

function severityClass(val) {
  if (!val || val === 'none') return 'pill-none';
  if (val === 'mild') return 'pill-mild';
  if (val === 'moderate') return 'pill-moderate';
  if (val === 'severe') return 'pill-severe';
  return 'pill-neutral';
}

function metricVal(val, type) {
  if (val == null) return { html: '—', cls: 'val-gray' };
  if (type === 'recovery') {
    const cls = val >= 67 ? 'val-green' : val >= 34 ? 'val-yellow' : 'val-red';
    return { html: Math.round(val), cls };
  }
  if (type === 'hrv') {
    const cls = val >= 50 ? 'val-green' : val >= 40 ? 'val-yellow' : 'val-red';
    return { html: val.toFixed(1), cls };
  }
  if (type === 'rhr') return { html: Math.round(val), cls: 'val-blue' };
  if (type === 'strain') {
    const cls = val >= 14 ? 'val-red' : val >= 10 ? 'val-yellow' : 'val-green';
    return { html: val.toFixed(1), cls };
  }
  return { html: val, cls: 'val-gray' };
}

function renderDayCard(date, whoop, checkin, isToday) {
  const w = whoop || {};
  const rec = w.recovery?.score || {};
  const slp = w.sleep?.score || {};
  const wrk = w.workout?.score || {};

  const recovery = rec.recovery_score ?? null;
  const hrv = rec.hrv_rmssd_milli ?? null;
  const rhr = rec.resting_heart_rate ?? null;
  const strain = wrk.strain ?? null;
  const sleepPerf = slp.sleep_performance_percentage ?? null;
  const sleepEff = slp.sleep_efficiency_percentage ?? null;

  const rv = metricVal(recovery, 'recovery');
  const hv = metricVal(hrv, 'hrv');
  const rhv = metricVal(rhr, 'rhr');
  const sv = metricVal(strain, 'strain');

  const cardClass = isToday ? 'today-card' : 'day-row';
  const labelStyle = isToday ? '' : '';

  let pills = '';
  if (checkin) {
    const fields = [
      ['PEM', checkin.pem],
      ['Brain fog', checkin.brain_fog],
      ['Pain', checkin.pain],
    ];
    pills = fields.map(([label, val]) => val && val !== 'none'
      ? `<span class="pill ${severityClass(val)}">${label}: ${val}</span>` : '').join('');
    if (checkin.activity) pills += `<span class="pill pill-neutral">Activity: ${checkin.activity}</span>`;
    if (checkin.pem === 'severe') pills += `<span class="pill pill-severe">⚠️ Severe PEM</span>`;
    if (checkin.left_home === 'yes') pills += `<span class="pill pill-neutral">🚗 Left home</span>`;
    if (checkin.probiotics === 'yes') pills += `<span class="pill pill-neutral">💨 Probiotics</span>`;
  }

  let sleepBar = '';
  if (sleepPerf != null) {
    const pct = Math.round(sleepPerf);
    const barCls = pct < 40 ? 'fill-red' : '';
    const effStr = sleepEff != null ? ` · ${sleepEff.toFixed(0)}% efficiency` : '';
    const inBed = slp.total_in_bed_time_milli ? ` · ${(slp.total_in_bed_time_milli/3600000).toFixed(1)}h in bed` : '';
    const lblStyle = isToday ? 'color:rgba(255,255,255,0.65);' : '';
    sleepBar = `
      <div class="sleep-bar-wrap">
        <div class="sleep-bar-label" style="${lblStyle}">Sleep performance: ${pct}%${inBed}${effStr}</div>
        <div class="sleep-bar-track"><div class="sleep-bar-fill ${barCls}" style="width:${pct}%"></div></div>
      </div>`;
  }

  let notes = '';
  if (checkin?.notes) notes = `<div class="notes-text">${checkin.notes}</div>`;

  const badge = isToday
    ? (checkin ? feelingBadge(checkin.feeling, checkin).replace('feeling-bad">', 'feeling-bad" style="background:rgba(200,50,50,0.4);color:#ef8a7a;">').replace('feeling-good">', 'feeling-good" style="background:rgba(50,180,100,0.3);color:#6fd9a0;">').replace('feeling-mixed">', 'feeling-mixed" style="background:rgba(200,160,0,0.3);color:#ffd166;">')
               : `<div class="feeling-badge" style="background:rgba(255,255,255,0.15);color:rgba(255,255,255,0.6);">No check-in</div>`)
    : feelingBadge(checkin?.feeling, checkin);

  return `
    <div class="${cardClass}">
      <div class="day-header">
        <div class="day-label">${fmtDate(date)}</div>
        ${badge}
      </div>
      <div class="metrics-row">
        <div class="metric-chip"><div class="val ${rv.cls}">${rv.html}</div><div class="lbl">Recovery</div></div>
        <div class="metric-chip"><div class="val ${hv.cls}">${hv.html}</div><div class="lbl">HRV ms</div></div>
        <div class="metric-chip"><div class="val ${rhv.cls}">${rhv.html}</div><div class="lbl">RHR</div></div>
        <div class="metric-chip"><div class="val ${sv.cls}">${sv.html}</div><div class="lbl">Strain</div></div>
      </div>
      ${sleepBar}
      ${pills ? `<div class="pills-row" style="margin-top:8px;">${pills}</div>` : ''}
      ${notes}
    </div>`;
}

async function loadDashboard() {
  const dates = [0,1,2,3,4].map(easternDate);
  const today = dates[0];

  // Fetch all data in parallel
  const [patternRes, whoopRes, checkinRes] = await Promise.all([
    fetch('/api/patterns').then(r => r.json()).catch(() => ({ alerts: [] })),
    fetch('/api/dashboard?user=hannah').then(r => r.json()).catch(() => ({})),
    Promise.all(dates.map(d =>
      fetch(`/api/checkin/${d}?user=hannah`).then(r => r.json()).catch(() => ({ found: false }))
    ))
  ]);

  // Pattern alerts
  const alertContainer = document.getElementById('pattern-alerts');
  if (!patternRes.alerts || patternRes.alerts.length === 0) {
    alertContainer.innerHTML = `<div class="alert-strip" style="background:#d4edda;border-color:#b8dfc5;color:#155724;margin-bottom:12px;"><div class="alert-icon">✅</div><div><strong>No active PEM risk alerts</strong> — Patterns look stable today.</div></div>`;
  } else {
    alertContainer.innerHTML = patternRes.alerts.map(a => {
      const cls = a.level === 'critical' ? 'alert-strip critical-alert' : 'alert-strip';
      return `<div class="${cls}" style="margin-bottom:10px;"><div class="alert-icon">${a.icon}</div><div><strong>${a.title}</strong> — ${a.body}</div></div>`;
    }).join('');
  }

  // Build day cards
  const whoop = whoopRes.whoop || {};
  const container = document.getElementById('days-container');
  let html = '';

  dates.forEach((date, i) => {
    const checkin = checkinRes[i]?.found ? checkinRes[i].data : null;
    const w = whoop[date] || null;
    const isToday = i === 0;
    if (isToday) html += `<div class="section-label" style="margin-top:14px;">Today · ${fmtDate(date)}</div>`;
    else html += `<div class="section-label">${fmtDate(date)}</div>`;
    html += renderDayCard(date, w, checkin, isToday);
  });

  container.innerHTML = html;

  // Footer
  document.getElementById('footer').innerHTML =
    `Cadence · Updated ${new Date().toLocaleTimeString('en-US', { timeZone: 'America/New_York', hour: '2-digit', minute: '2-digit' })} ET · <a href="javascript:location.reload()" style="color:#9aabbf;">Refresh</a>`;
}

function toggleSimple() {
  const isSimple = document.body.classList.toggle('simple-mode');
  document.getElementById('simple-btn').textContent = isSimple ? '📊 Full view' : '🧘 Simple';
  localStorage.setItem('hannah-simple-mode', isSimple ? '1' : '0');
}

function renderSimpleCard(patternData, whoopData, checkinData) {
  const today = easternDate(0);
  const w = (whoopData.whoop || {})[today] || {};
  const rec = w.recovery?.score || {};
  const checkin = checkinData?.found ? checkinData.data : null;

  const recovery = rec.recovery_score ?? null;
  const hrv = rec.hrv_rmssd_milli ?? null;
  const feeling = checkin?.feeling || null;
  const pem = checkin?.pem || null;
  const notes = checkin?.notes || null;
  const status = patternData.status || 'ok';

  let emoji, headline, sub, statusCls;
  if (status === 'critical' || feeling === 'terrible' || feeling === 'bad') {
    emoji = '😔'; statusCls = 'status-red';
    headline = pem === 'severe' ? 'Rest day — severe PEM' : 'Rest day';
    sub = 'Low activity only. No pushing through.';
  } else if (status === 'warning' || feeling === 'okay') {
    emoji = '😐'; statusCls = 'status-yellow';
    headline = 'Take it easy today';
    sub = 'Some warning signs. Stay within your energy envelope.';
  } else {
    emoji = '🌿'; statusCls = 'status-green';
    headline = 'Feeling okay';
    sub = 'Stay within your pacing limits.';
  }

  const rColor = recovery == null ? '#8a9ab0' : recovery >= 67 ? '#1a8a4a' : recovery >= 34 ? '#b08a00' : '#c0392b';
  const hColor = hrv == null ? '#8a9ab0' : hrv >= 50 ? '#1a8a4a' : hrv >= 40 ? '#b08a00' : '#c0392b';

  document.getElementById('simple-status-block').innerHTML = `
    <div class="simple-status ${statusCls}">
      <div class="simple-emoji">${emoji}</div>
      <div class="simple-headline">${headline}</div>
      <div class="simple-sub">${sub}</div>
    </div>
    <div class="simple-metrics">
      <div class="simple-metric">
        <div class="big-val" style="color:${rColor}">${recovery != null ? Math.round(recovery) + '%' : '—'}</div>
        <div class="big-lbl">Recovery</div>
      </div>
      <div class="simple-metric">
        <div class="big-val" style="color:${hColor}">${hrv != null ? Math.round(hrv) : '—'}</div>
        <div class="big-lbl">HRV ms</div>
      </div>
    </div>
    ${notes ? `<div class="simple-note">“${notes}”</div>` : ''}
  `;
}

async function loadDashboard() {
  const dates = [0,1,2,3,4].map(easternDate);
  const today = dates[0];

  const [patternRes, whoopRes, checkinRes] = await Promise.all([
    fetch('/api/patterns').then(r => r.json()).catch(() => ({ alerts: [], status: 'ok' })),
    fetch('/api/dashboard?user=hannah').then(r => r.json()).catch(() => ({})),
    Promise.all(dates.map(d =>
      fetch(`/api/checkin/${d}?user=hannah`).then(r => r.json()).catch(() => ({ found: false }))
    ))
  ]);

  // Restore simple mode preference
  if (localStorage.getItem('hannah-simple-mode') === '1') {
    document.body.classList.add('simple-mode');
    document.getElementById('simple-btn').textContent = '📊 Full view';
  }

  // Build simple card
  renderSimpleCard(patternRes, whoopRes, checkinRes[0]);

  // Pattern alerts
  const alertContainer = document.getElementById('pattern-alerts');
  if (!patternRes.alerts || patternRes.alerts.length === 0) {
    alertContainer.innerHTML = `<div class="alert-strip" style="background:#d4edda;border-color:#b8dfc5;color:#155724;margin-bottom:12px;"><div class="alert-icon">✅</div><div><strong>No active PEM risk alerts</strong> — Patterns look stable today.</div></div>`;
  } else {
    alertContainer.innerHTML = patternRes.alerts.map(a => {
      const cls = a.level === 'critical' ? 'alert-strip critical-alert' : 'alert-strip';
      return `<div class="${cls}" style="margin-bottom:10px;"><div class="alert-icon">${a.icon}</div><div><strong>${a.title}</strong> — ${a.body}</div></div>`;
    }).join('');
  }

  // Build day cards
  const whoop = whoopRes.whoop || {};
  const container = document.getElementById('days-container');
  let html = '';

  dates.forEach((date, i) => {
    const checkin = checkinRes[i]?.found ? checkinRes[i].data : null;
    const w = whoop[date] || null;
    const isToday = i === 0;
    if (isToday) html += `<div class="section-label" style="margin-top:14px;">Today · ${fmtDate(date)}</div>`;
    else html += `<div class="section-label">${fmtDate(date)}</div>`;
    html += renderDayCard(date, w, checkin, isToday);
  });

  container.innerHTML = html;

  document.getElementById('footer').innerHTML =
    `Cadence · Updated ${new Date().toLocaleTimeString('en-US', { timeZone: 'America/New_York', hour: '2-digit', minute: '2-digit' })} ET · <a href="javascript:location.reload()" style="color:#9aabbf;">Refresh</a>`;
}

loadDashboard();
</script>
</body>
</html>
